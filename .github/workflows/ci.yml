name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Lint seats, skills and scripts
        run: node scripts/lint.mjs
      - name: Validate marketplace catalog + plugin integrity
        run: node scripts/validate-marketplace.mjs
      - name: Installer dry run
        run: ./install.sh --dry-run
      - name: Smoke-test the protocol scripts
        run: |
          S=plugins/quorum-review/skills/quorum-review/scripts
          node $S/panel.mjs --agents-dir plugins/quorum-review/agents --no-omp
          node $S/panel.mjs --agents-dir plugins/quorum-review/agents --no-omp --prefix rev-sec- --json > /tmp/panel.json
          node $S/packet.mjs --focus "ci smoke" --files README.md,AGENTS.md --out /tmp/pkt.md --json
          grep -q "ci smoke" /tmp/pkt.md && grep -q '"fingerprint"' /tmp/pkt.md.json
          mkdir -p /tmp/res
          printf '%s' '{"agent":"rev-sec-glm","resolvedModel":"nanogpt/zai-org/glm-5.3","overall_correctness":"incorrect","confidence":0.8,"explanation":"x","findings":[{"title":"Reject unchecked input","body":"a","priority":1,"confidence":0.9,"file_path":"src/a.cs","line_start":1,"line_end":3,"category":"input-validation"}]}' > /tmp/res/rev-sec-glm-1.json
          printf '%s' '{"agent":"rev-sec-kimi","resolvedModel":"nanogpt/moonshotai/kimi-k3","overall_correctness":"incorrect","confidence":0.7,"explanation":"y","findings":[{"title":"Unchecked input reaches sink","body":"b","priority":1,"confidence":0.8,"file_path":"/repo/src/a.cs","line_start":2,"line_end":4,"category":"input-validation"}]}' > /tmp/res/rev-sec-kimi-1.json
          node $S/dedupe.mjs --dir /tmp/res --panel /tmp/panel.json --cwd /repo --out /tmp/report.md --json
          grep -q "2/3" /tmp/report.md && grep -q "no result: rev-sec-grok" /tmp/report.md
          node $S/minipacket.mjs --report /tmp/report.md.report.json --mode refute --select all --cwd /repo --out /tmp/mini.md
          grep -q "Reject unchecked input" /tmp/mini.md
