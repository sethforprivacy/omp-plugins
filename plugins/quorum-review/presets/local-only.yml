# quorum-review preset: every seat on models served from your own OpenAI-compatible router
# (the `vllm` provider in ~/.omp/agent/models.yml). Use when the code under review must not
# leave your machines.
#
# Caveat: two local models are less independent than four vendors — corroboration counts mean
# less, and a shared blind spot goes unnoticed. Keep at least two DIFFERENT model families active
# and park the rest, so the panel can still quorum (>= 2 seats) without pretending to be four.
#
# One run:      omp --config presets/local-only.yml
task:
  agentModelOverrides:
    rev-quorum-glm: vllm/GLM-5.3-Flash-Ring:high
    rev-quorum-grok: vllm/deepseek-v4-flash-0731:high
    rev-sec-glm: vllm/GLM-5.3-Flash-Ring:max
    rev-sec-kimi: vllm/deepseek-v4-flash-0731:max
  disabledAgents:
    - rev-quorum-gem
    - rev-quorum-nemo
    - rev-sec-grok
